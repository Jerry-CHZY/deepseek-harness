# Bundle patch: mount the readout row when this package is installed into a
# profile with `dsh plugin add`. The shipped web-app bundle mounts the same row;
# the Loader reuses an entry by id, so a profile that composes both stays a
# single entry.
- insert:
    - id: ui-token-usage
      name: '@deepseek-ai/dsh-client-ui-token-usage'
